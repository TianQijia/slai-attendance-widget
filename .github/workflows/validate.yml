name: Validate final packages
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
          - os: windows-2022
            target: win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      SLAI_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm test
      - run: npm run audit:release
      - run: npm run build
      - run: npm run test:install
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slai-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
