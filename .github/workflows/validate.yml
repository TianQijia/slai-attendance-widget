name: Validate final packages
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm test
      - run: npm run audit:release
      - run: npm run build
      - run: npm run test:install
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slai-chrome-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run audit:release
      - run: npm run build:android
      - name: Enable emulator KVM access
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          disable-animations: true
          script: |
            npm run test:android
            mkdir -p test-results
            adb pull /sdcard/Android/data/cn.slai.attendance/files/android-verified.png test-results/android-device.png
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: slai-android-validation
          path: |
            dist/*.apk
            dist/ANDROID-SHA256SUMS.txt
            android/app/build/reports/androidTests/
            android/app/build/reports/lint-results-release.html
            test-results/android-device.png
